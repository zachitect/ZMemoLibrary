<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZMemoLibrary</title>
  <style>
    :root { color-scheme: dark; font-family: "Cascadia Code", "Cascadia Mono", Consolas, "Courier New", monospace; background: #0d1117; color: #e6edf3; }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { margin: 0; min-width: 320px; background: radial-gradient(circle at top, #172033 0, #0d1117 430px); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1180px, calc(100% - 24px)); height: calc(100vh - 80px); margin: 0 auto; padding-top: 12px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
    .top-panel, .catalogue-section, .history, .issues { background: #151b23; border: 1px solid #303946; border-radius: 9px; box-shadow: 0 8px 24px rgba(0,0,0,.16); }
    .top-panel { z-index: 20; overflow: hidden; }
    .header { padding: 14px 18px; display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
    .header-actions { width: 150px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center; }
    .header-actions .button { width: 100%; min-width: 0; padding-left: 6px; padding-right: 6px; }
    .theme-button { font-size: 17px; line-height: 1; }
    h1 { margin: 0; font-family: "Cascadia Code", "Cascadia Mono", Consolas, monospace; font-size: 23px; font-weight: 650; letter-spacing: -.35px; color: #f0f6fc; }
    .subtitle { margin: 5px 0 0; color: #9aa7b5; font-size: 12px; letter-spacing: 0; }
    .toolbar { padding: 10px 18px; display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 10px; border-bottom: 1px solid #303946; }
    .toolbar .button { width: 100%; }
    #search { width: 100%; height: 40px; border: 1px solid #3b4655; border-radius: 6px; padding: 0 12px; background: #0d1117; color: #e6edf3; }
    #search:focus { outline: 2px solid #3b82c4; outline-offset: 1px; border-color: #58a6d8; }
    .button { min-height: 38px; border: 1px solid #3b4655; border-radius: 6px; background: #1c2430; color: #dce5ee; padding: 7px 13px; font-weight: 600; }
    .button:hover:not(:disabled) { border-color: #58a6d8; background: #243247; }
    .button.primary { background: #1f6f9f; border-color: #3f95c8; color: #fff; }
    .button.primary:hover:not(:disabled) { background: #2785ba; }
    .button:disabled { opacity: .5; cursor: default; }
    .status { padding: 9px 18px; color: #9aa7b5; display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; font-family: "Cascadia Code", "Cascadia Mono", Consolas, monospace; font-size: 11px; }
    .error { color: #ff7b72; }
    .warning { color: #e3b341; }
    .catalogue-section { min-height: 0; padding: 12px; display: flex; flex-direction: column; overflow: hidden; }
    .catalogue-heading { flex: none; margin: 0 0 10px; color: #9aa7b5; font-size: 12px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; }
    .list { min-height: 0; overflow-y: auto; display: grid; gap: 0; outline: none; scrollbar-gutter: stable; }
    .knowledge-row { padding: 15px 10px; cursor: default; user-select: none; border: 0; border-bottom: 1px solid #303946; border-radius: 0; background: transparent; box-shadow: none; transition: background .1s; }
    .knowledge-row:last-child { border-bottom: 0; }
    .knowledge-row:hover { background: #19212c; }
    .knowledge-row.connected { background: #18313a; box-shadow: inset 3px 0 #56d4dd; }
    .knowledge-row.selected { background: #14283a; box-shadow: inset 3px 0 #58a6d8; }
    .knowledge-row.ambiguous { background: #2a2417; box-shadow: inset 3px 0 #9e7c2f; }
    .row-top { display: flex; gap: 12px; justify-content: space-between; align-items: start; }
    .knowledge-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
    .guid { font-family: "Cascadia Code", "Cascadia Mono", Consolas, monospace; color: #7dc4e4; font-size: 11px; font-weight: 600; letter-spacing: .15px; overflow-wrap: anywhere; }
    .title { margin-top: 6px; font-family: "Cascadia Code", "Cascadia Mono", Consolas, monospace; font-weight: 650; font-size: 16px; line-height: 1.35; color: #f0f6fc; letter-spacing: -.2px; }
    .updated { margin-top: 5px; color: #93a4b7; font-family: "Cascadia Code", "Cascadia Mono", Consolas, monospace; font-size: 11px; letter-spacing: 0; }
    .summary { margin: 11px 0 0; color: #c7d0da; font-family: "Cascadia Code", "Cascadia Mono", Consolas, monospace; font-size: 13px; line-height: 1.62; white-space: pre-wrap; user-select: text; }
    .versions-button { flex: none; border: 0; background: transparent; color: #79c0ff; padding: 2px 0; font-family: "Cascadia Code", "Cascadia Mono", Consolas, monospace; font-size: 11px; }
    .history { margin: -2px 0 4px 24px; padding: 8px; border-top-left-radius: 0; background: #111820; }
    .history-item { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 9px 8px; border-bottom: 1px solid #2b3440; }
    .history-item:last-child { border-bottom: 0; }
    .history-title { font-family: "Cascadia Code", "Cascadia Mono", Consolas, monospace; font-weight: 650; color: #dce5ee; }
    .history-meta { color: #8795a5; font-family: "Cascadia Code", "Cascadia Mono", Consolas, monospace; font-size: 10px; margin-top: 3px; }
    .small-button { border: 1px solid #3b4655; border-radius: 5px; background: #1c2430; color: #dce5ee; padding: 5px 9px; font-weight: 600; }
    .issues { max-height: 22vh; padding: 12px 14px; overflow: auto; }
    .issues summary { cursor: pointer; font-weight: 600; }
    .issues li { margin: 7px 0; overflow-wrap: anywhere; }
    .empty { padding: 46px 20px; text-align: center; color: #8795a5; }
    .selection-bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(13,17,23,.96); border-top: 1px solid #303946; box-shadow: 0 -5px 18px rgba(0,0,0,.32); backdrop-filter: blur(10px); }
    .selection-inner { width: min(1180px, calc(100% - 24px)); margin: 0 auto; min-height: 68px; display: flex; gap: 10px; align-items: center; }
    .selection-count { margin-right: auto; color: #a6b2c0; font-family: "Cascadia Code", "Cascadia Mono", Consolas, monospace; font-size: 11px; }
    dialog { width: min(900px, calc(100% - 24px)); max-height: 88vh; border: 1px solid #465365; border-radius: 9px; padding: 0; background: #151b23; color: #e6edf3; box-shadow: 0 22px 70px rgba(0,0,0,.55); }
    dialog::backdrop { background: rgba(0,0,0,.72); }
    .dialog-header { position: sticky; top: 0; display: flex; gap: 12px; justify-content: space-between; align-items: start; background: #18212b; border-bottom: 1px solid #303946; padding: 14px 16px; }
    .dialog-body { padding: 16px; overflow: auto; }
    .markdown-body { color: #c7d0da; font-family: "Cascadia Code", "Cascadia Mono", Consolas, monospace; font-size: 13px; line-height: 1.62; overflow-wrap: anywhere; }
    .markdown-body > :first-child { margin-top: 0; }
    .markdown-body > :last-child { margin-bottom: 0; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 { margin: 1.35em 0 .55em; color: #f0f6fc; line-height: 1.3; }
    .markdown-body h1 { font-size: 1.65em; border-bottom: 1px solid #303946; padding-bottom: .3em; }
    .markdown-body h2 { font-size: 1.4em; border-bottom: 1px solid #303946; padding-bottom: .25em; }
    .markdown-body h3 { font-size: 1.18em; }
    .markdown-body p { margin: .75em 0; }
    .markdown-body ul, .markdown-body ol { margin: .7em 0; padding-left: 2em; }
    .markdown-body li { margin: .3em 0; }
    .markdown-body blockquote { margin: .8em 0; padding: .15em 1em; color: #a6b2c0; border-left: 3px solid #465365; }
    .markdown-body pre { margin: .9em 0; padding: 12px 14px; overflow: auto; white-space: pre; background: #0d1117; border: 1px solid #303946; border-radius: 5px; }
    .markdown-body code { font-family: "Cascadia Code", "Cascadia Mono", Consolas, monospace; background: #202833; border-radius: 3px; padding: .12em .35em; }
    .markdown-body pre code { background: transparent; padding: 0; }
    .markdown-body a { color: #79c0ff; }
    .markdown-body hr { border: 0; border-top: 1px solid #303946; margin: 1.25em 0; }
    .markdown-body table { width: 100%; border-collapse: collapse; margin: .9em 0; }
    .markdown-body th, .markdown-body td { border: 1px solid #303946; padding: 6px 8px; text-align: left; vertical-align: top; }

    html[data-theme="light"], body[data-theme="light"] { color-scheme: light; background: #f3f3f3; color: #1e1e1e; }
    body[data-theme="light"] .top-panel { background: #ffffff; }
    body[data-theme="light"] .top-panel,
    body[data-theme="light"] .catalogue-section,
    body[data-theme="light"] .history,
    body[data-theme="light"] .issues { background: #ffffff; border-color: #d0d0d0; box-shadow: 0 5px 16px rgba(0,0,0,.08); }
    body[data-theme="light"] h1,
    body[data-theme="light"] .title,
    body[data-theme="light"] .history-title { color: #1e1e1e; }
    body[data-theme="light"] .subtitle,
    body[data-theme="light"] .status,
    body[data-theme="light"] .updated,
    body[data-theme="light"] .history-meta,
    body[data-theme="light"] .selection-count,
    body[data-theme="light"] .catalogue-heading { color: #5f6670; }
    body[data-theme="light"] .summary { color: #30343a; }
    body[data-theme="light"] .guid,
    body[data-theme="light"] .versions-button { color: #0066a6; }
    body[data-theme="light"] #search { background: #ffffff; border-color: #a9a9a9; color: #1e1e1e; }
    body[data-theme="light"] .button,
    body[data-theme="light"] .small-button { background: #f6f6f6; border-color: #b8b8b8; color: #1e1e1e; }
    body[data-theme="light"] .button:hover:not(:disabled),
    body[data-theme="light"] .small-button:hover:not(:disabled) { background: #e8f1f8; border-color: #007acc; }
    body[data-theme="light"] .button.primary { background: #007acc; border-color: #007acc; color: #ffffff; }
    body[data-theme="light"] .knowledge-row { border-bottom-color: #d8d8d8; }
    body[data-theme="light"] .knowledge-row:hover { background: #f2f7fb; }
    body[data-theme="light"] .knowledge-row.connected { background: #e3f7f8; box-shadow: inset 3px 0 #169aa5; }
    body[data-theme="light"] .knowledge-row.selected { background: #dceeff; box-shadow: inset 3px 0 #007acc; }
    body[data-theme="light"] .knowledge-row.ambiguous { background: #fff4ce; box-shadow: inset 3px 0 #c89400; }
    body[data-theme="light"] .history { background: #f8f8f8; }
    body[data-theme="light"] .history-item { border-bottom-color: #dddddd; }
    body[data-theme="light"] .selection-bar { background: rgba(250,250,250,.98); border-top: 1px solid #d0d0d0; box-shadow: 0 -4px 14px rgba(0,0,0,.10); }
    body[data-theme="light"] .selection-inner { background: transparent; }
    body[data-theme="light"] .header,
    body[data-theme="light"] .toolbar { border-bottom-color: #d0d0d0; }
    body[data-theme="light"] dialog { background: #ffffff; color: #1e1e1e; border-color: #b8b8b8; }
    body[data-theme="light"] .dialog-header { background: #f3f3f3; border-bottom-color: #d0d0d0; }
    body[data-theme="light"] .markdown-body { color: #30343a; }
    body[data-theme="light"] .markdown-body h1,
    body[data-theme="light"] .markdown-body h2,
    body[data-theme="light"] .markdown-body h3,
    body[data-theme="light"] .markdown-body h4,
    body[data-theme="light"] .markdown-body h5,
    body[data-theme="light"] .markdown-body h6 { color: #1e1e1e; }
    body[data-theme="light"] .markdown-body h1,
    body[data-theme="light"] .markdown-body h2,
    body[data-theme="light"] .markdown-body hr,
    body[data-theme="light"] .markdown-body th,
    body[data-theme="light"] .markdown-body td { border-color: #d0d0d0; }
    body[data-theme="light"] .markdown-body blockquote { color: #5f6670; border-left-color: #b8b8b8; }
    body[data-theme="light"] .markdown-body pre { background: #f5f5f5; border-color: #d0d0d0; }
    body[data-theme="light"] .markdown-body code { background: #eeeeee; }
    body[data-theme="light"] .markdown-body a { color: #0066a6; }
    @media (max-width: 700px) {
      .shell { width: min(100% - 12px, 1180px); height: calc(100vh - 88px); padding-top: 6px; }
      .header { padding: 12px; }
      .header-actions { width: 126px; }
      .toolbar { padding: 10px 12px; grid-template-columns: minmax(0, 1fr) 126px; }
      .row-top { display: block; }
      .versions-button { margin-top: 8px; }
      .history { margin-left: 8px; }
      .history-item { grid-template-columns: 1fr auto; }
      .history-item .download-version { grid-column: 2; }
      .selection-inner { width: calc(100% - 12px); flex-wrap: wrap; padding: 8px 0; }
      .selection-count { width: 100%; }
    }

  </style>
</head>
<body>
  <main class="shell">
    <div class="top-panel">
      <section class="header">
        <div>
          <h1>ZMemoLibrary</h1>
          <p class="subtitle">Browse current knowledge, copy executive summaries, and download untouched Markdown files.</p>
        </div>
        <div class="header-actions">
          <button id="themeToggle" class="button theme-button" type="button" aria-label="Switch colour theme" title="Switch colour theme">☀</button>
          <button id="rescan" class="button" type="button">Rescan</button>
        </div>
      </section>

      <section class="toolbar">
        <input id="search" type="search" autocomplete="off" placeholder="Search current titles, summaries, keywords, content, or GUID">
        <button id="clearSearch" class="button" type="button">Clear Search</button>
      </section>

      <section id="status" class="status" aria-live="polite"></section>
    </div>

    <section class="catalogue-section">
      <h2 class="catalogue-heading">Current Knowledge Catalogue</h2>
      <section id="list" class="list" tabindex="0" aria-label="Knowledge catalogue"></section>
    </section>

    <details id="issues" class="issues" hidden>
      <summary id="issuesSummary"></summary>
      <ul id="issuesList"></ul>
    </details>
  </main>

  <footer class="selection-bar">
    <div class="selection-inner">
      <div id="selectionCount" class="selection-count">0 selected · Ctrl+C copies displayed summaries</div>
      <button id="clearSelection" class="button" type="button" disabled>Clear Selection</button>
      <button id="downloadSelected" class="button primary" type="button" disabled>Download Selected</button>
    </div>
  </footer>

  <dialog id="viewer">
    <div class="dialog-header">
      <div>
        <div id="viewerStatus" class="updated"></div>
        <div id="viewerTitle" class="title"></div>
      </div>
      <button id="closeViewer" class="button" type="button">Close</button>
    </div>
    <div class="dialog-body">
      <div id="viewerMeta"></div>
      <div id="viewerBody" class="markdown-body"></div>
    </div>
  </dialog>

<script src="/app.js"></script>
</body>
</html>
